<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Top Languages Card">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="20" fill="url(#g)"/>
  <rect x="20" y="20" width="600" height="240" rx="16" fill="none" stroke="#1e293b"/>
  <text x="40" y="62" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Top Languages</text>
  <text x="40" y="105" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Language card endpoint can be swapped to self-hosted.</text>
  <text x="40" y="140" fill="#a855f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Consistent branding across all analytics cards.</text>
  <text x="40" y="178" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Fallback keeps profile clean during upstream outages.</text>
  <text x="40" y="220" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">View repositories for up-to-date language mix →</text>
</svg>
