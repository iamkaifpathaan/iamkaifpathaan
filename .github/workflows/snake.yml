name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?color_snake=%23e8b45a&color_dots=%231d1d20,%233a3226,%23705426,%23b8893f,%23e8b45a
            assets/github-contribution-grid-snake.svg?color_snake=%23a8782a&color_dots=%23ece8e1,%23f1dcb0,%23e3bd75,%23c8963f,%23a8782a

      - name: Commit and push updated snake SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: assets/github-contribution-grid-snake*.svg
